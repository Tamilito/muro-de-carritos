name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Bajar el proyecto
        uses: actions/checkout@v4

      - name: Acomodar archivos si se subieron dentro de una carpeta
        run: |
          if [ ! -f package.json ] && [ -f muro-de-carritos-app/package.json ]; then
            cp -r muro-de-carritos-app/. .
            echo "OTA_DIR=muro-de-carritos-app/www" >> "$GITHUB_ENV"
          else
            echo "OTA_DIR=www" >> "$GITHUB_ENV"
          fi

      - name: Leer la versión del muro
        run: |
          VER=$(grep -oP "APP_VERSION='\K[0-9.]+" www/index.html || echo "1.0.0")
          echo "VER=$VER" >> "$GITHUB_ENV"
          echo "Versión del muro: $VER"

      - name: Decirle a la app de dónde bajar sus actualizaciones
        run: |
          sed -i "s#^var OTA_REPO='', OTA_BRANCH='main', OTA_DIR='www';#var OTA_REPO='${{ github.repository }}', OTA_BRANCH='${{ github.ref_name }}', OTA_DIR='$OTA_DIR';#" www/index.html
          grep -n "^var OTA_REPO=" www/index.html || echo "::warning::Este index.html no trae actualizaciones automáticas (es de antes de la 1.2.0)."
          if [ "${{ github.event.repository.private }}" = "true" ]; then
            echo "::warning::El repo es privado: la app no podrá bajar actualizaciones solas. Hazlo público en Settings > General > Danger Zone > Change visibility."
          fi

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar Capacitor
        run: npm install --no-audit --no-fund

      - name: Tipografías para usar sin internet (opcional)
        continue-on-error: true
        run: node scripts/fuentes.js

      - name: Crear el proyecto Android
        run: |
          npx cap add android
          npx cap sync android
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/; s/versionName \"[^\"]*\"/versionName \"$VER\"/" android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle

      - name: Ícono, pantalla de inicio y firma fija
        run: |
          cp -r recursos/res/. android/app/src/main/res/
          for d in android/app/src/main/res/drawable*; do
            if [ -f "$d/splash.png" ]; then
              case "$d" in
                *land*) cp recursos/splash-land.png "$d/splash.png" ;;
                *) cp recursos/splash-port.png "$d/splash.png" ;;
              esac
            fi
          done
          mkdir -p "$HOME/.android"
          cp recursos/debug.keystore "$HOME/.android/debug.keystore"

      - name: Compilar el APK
        working-directory: android
        run: |
          export ANDROID_USER_HOME="$HOME/.android"
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Ponerle nombre
        run: cp android/app/build/outputs/apk/debug/app-debug.apk "muro-de-carritos-v$VER.apk"

      - name: Guardar como archivo de la ejecución
        uses: actions/upload-artifact@v4
        with:
          name: muro-de-carritos-apk
          path: muro-de-carritos-v${{ env.VER }}.apk

      - name: Publicar en Releases para bajarlo desde el celular
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VER }}-${{ github.run_number }}
          name: Muro de Carritos v${{ env.VER }}
          body: "Versión ${{ env.VER }} · compilación ${{ github.run_number }}. Los cambios de cada versión están en CAMBIOS.md."
          files: muro-de-carritos-v${{ env.VER }}.apk
          make_latest: true
